# atrium: one login and one search box over a self-hosted media library.
#
# The important line in this file is the one that is missing. Neither navidrome
# nor jellyfin publishes a port. They are reachable only on the internal compose
# network, by atrium. That is what makes "one login" true rather than decorative:
# their own login screens are not one URL away, because they are not reachable.
#
#   docker compose up --build   then open http://localhost:8099
#
# Drop files into ./media/music and ./media/movies. Nothing else to configure and
# no API keys to fetch - atrium provisions its own credentials on first boot.

name: atrium

services:
  atrium:
    build: .
    container_name: atrium
    restart: unless-stopped
    ports:
      # Host port is configurable because 8080 is a popular address - a Calibre
      # content server defaults to it, for one. Override with ATRIUM_PORT.
      - "${ATRIUM_PORT:-8099}:8080"
    environment:
      # A backend exists if its URL is set, so this file decides the stack.
      ATRIUM_NAVIDROME_URL: http://navidrome:4533
      ATRIUM_JELLYFIN_URL: http://jellyfin:8096
      # The movie folder as *jellyfin's* container sees it, which is what its
      # library API wants - not atrium's view of the same directory.
      ATRIUM_JELLYFIN_MEDIA_PATH: /media/movies
      ATRIUM_AUDIOBOOKSHELF_URL: http://audiobookshelf:80
      ATRIUM_AUDIOBOOKSHELF_MEDIA_PATH: /audiobooks
      ATRIUM_CALIBREWEB_URL: http://calibreweb:8083
      ATRIUM_CALIBREWEB_MEDIA_PATH: /books
      ATRIUM_LOG_LEVEL: info
    volumes:
      - atrium-state:/var/lib/atrium
    depends_on:
      - navidrome
      - jellyfin
      - audiobookshelf
      - calibreweb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  navidrome:
    image: deluan/navidrome:latest
    container_name: atrium-navidrome
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # Rescan often enough that dropping a file in feels immediate.
      ND_SCANSCHEDULE: 1m
      ND_LOGLEVEL: info
      # Nothing here should phone home; atrium is the only client.
      ND_ENABLEEXTERNALSERVICES: "false"
    volumes:
      - ./media/music:/music:ro
      - navidrome-data:/data
    # Deliberately no ports. atrium reaches it at http://navidrome:4533.

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: atrium-jellyfin
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media/movies:/media/movies:ro
    # Deliberately no ports. atrium reaches it at http://jellyfin:8096.

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: atrium-audiobookshelf
    restart: unless-stopped
    volumes:
      - ./media/audiobooks:/audiobooks
      - abs-config:/config
      - abs-metadata:/metadata
    # Deliberately no ports. atrium reaches it at http://audiobookshelf:80.

  calibreweb:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: atrium-calibreweb
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Brings calibredb into the image, which is what lets a library be
      # created and books added without a human opening the Calibre desktop app.
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - calibreweb-config:/config
      - ./media/ebooks:/books
      # Bootstraps an empty calibre library so a fresh install with no ebooks
      # still produces a working backend rather than a failed one.
      - ./scripts/calibreweb-init:/custom-cont-init.d:ro
    # Deliberately no ports. atrium reaches it at http://calibreweb:8083.

volumes:
  atrium-state:
  navidrome-data:
  jellyfin-config:
  jellyfin-cache:
  abs-config:
  abs-metadata:
  calibreweb-config:
