# SoundStorm: one login and one search box over a self-hosted media library.
#
# This file is the whole installation. It needs no repository, no build step and
# no configuration - download it into an empty folder and run:
#
#   docker compose up -d        then open http://localhost:8099
#
# SoundStorm creates ./library beside this file on first run, with one folder per
# media type. Put a file in the matching folder and it appears. There are no API
# keys to fetch: SoundStorm provisions its own credentials for every backend on
# first boot.
#
#   library/
#     music/   movies/   tv/   audiobooks/   ebooks/   documents/   pictures/
#
# The important line in this file is the one that is missing. None of the three
# backends publishes a port. They are reachable only on the internal compose
# network, by SoundStorm. That is what makes "one login" true rather than
# decorative: their own login screens are not one URL away, because they are not
# reachable at all.
#
# To build from source instead of pulling a published image - which is what you
# want if you are working on SoundStorm itself:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

name: soundstorm

services:
  soundstorm:
    # Pinned by tag rather than digest so an upgrade is `docker compose pull`.
    # Set SOUNDSTORM_IMAGE to hold a specific version.
    image: ${SOUNDSTORM_IMAGE:-ghcr.io/gabrielhollberg/soundstorm:latest}
    container_name: soundstorm
    restart: unless-stopped
    networks:
      default:
        aliases:
          # A second name for itself, and the Tailscale sidecar proxies to
          # this one rather than to "soundstorm".
          #
          # That sidecar takes "soundstorm" as its *tailnet* hostname, which
          # is the address people end up typing - and Docker writes a
          # container's own hostname into its /etc/hosts. So inside it,
          # "soundstorm" resolves to itself, and the proxy target quietly
          # became a loopback: everything healthy, tailnet address answering
          # 502. Found by asking the container to fetch its own proxy target.
          - soundstorm-app
    ports:
      # Host port is configurable because 8080 is a popular address - a Calibre
      # content server defaults to it, for one. Override with SOUNDSTORM_PORT,
      # which the installer writes into a .env file beside this one.
      - "${SOUNDSTORM_PORT:-8099}:8080"
    environment:
      # A backend exists if its URL is set, so this file decides the stack.
      SOUNDSTORM_NAVIDROME_URL: http://navidrome:4533
      SOUNDSTORM_JELLYFIN_URL: http://jellyfin:8096
      # The movie folder as *jellyfin's* container sees it, which is what its
      # library API wants - not SoundStorm's view of the same directory.
      SOUNDSTORM_JELLYFIN_MEDIA_PATH: /media/movies
      SOUNDSTORM_JELLYFIN_TV_PATH: /media/tv
      SOUNDSTORM_AUDIOBOOKSHELF_URL: http://audiobookshelf:80
      SOUNDSTORM_AUDIOBOOKSHELF_MEDIA_PATH: /audiobooks
      SOUNDSTORM_IMMICH_URL: http://immich-server:2283
      SOUNDSTORM_IMMICH_MEDIA_PATH: /pictures
      # SoundStorm creates and owns this folder. Ebooks are read straight out of
      # it, since an EPUB describes itself and needs no backend; the other
      # three folders are handed to the server that indexes them.
      SOUNDSTORM_LIBRARY_DIR: /library
      # How the same folder looks to whoever ran compose, for the UI to show.
      SOUNDSTORM_LIBRARY_HINT: ${SOUNDSTORM_LIBRARY_HINT:-${SOUNDSTORM_LIBRARY_PATH:-./library}}
      SOUNDSTORM_LOG_LEVEL: info

      # TLS. Off by default: the only certificate SoundStorm can make by itself
      # is one no browser trusts, and a full-page warning on every device is a
      # poor trade on a home network. See the README before turning it on.
      #
      #   SOUNDSTORM_TLS=self-signed   SoundStorm runs its own certificate
      #                                authority. Install http://host:8099/ca.crt
      #                                once per device to stop the warning.
      #   SOUNDSTORM_TLS=auto          as self-signed, plus a real certificate
      #                                for a <id>.home.soundstorm.dev name, and
      #                                http and https on the same port.
      #   SOUNDSTORM_TLS=file          bring your own, with _CERT and _KEY.
      #
      # SOUNDSTORM_TLS_HOSTS is the machine's LAN address, written by the
      # installer: a bare IP gets no name in the handshake, so it has to be
      # told, and auto mode points its name there.
      SOUNDSTORM_TLS: ${SOUNDSTORM_TLS:-off}
      SOUNDSTORM_TLS_CERT: ${SOUNDSTORM_TLS_CERT:-}
      SOUNDSTORM_TLS_KEY: ${SOUNDSTORM_TLS_KEY:-}
      SOUNDSTORM_TLS_HOSTS: ${SOUNDSTORM_TLS_HOSTS:-}
      # Auto mode's two outside services; empty means the real ones. Set the
      # directory to Let's Encrypt staging for a first run.
      SOUNDSTORM_ACME_DIRECTORY: ${SOUNDSTORM_ACME_DIRECTORY:-}
      SOUNDSTORM_NAMES_URL: ${SOUNDSTORM_NAMES_URL:-}
      # Remote access: reach this install from outside the house. Off by
      # default - it puts the server on the internet, which is a real
      # decision. Needs auto TLS. SOUNDSTORM_PORT is the published port, which
      # the container is otherwise unaware of, so the name service knows which
      # port to confirm is reachable and a remote URL carries the right one.
      SOUNDSTORM_REMOTE_ACCESS: ${SOUNDSTORM_REMOTE_ACCESS:-off}
      SOUNDSTORM_PORT: ${SOUNDSTORM_PORT:-8099}
      # Behind a reverse proxy that terminates TLS: lets X-Forwarded-Proto
      # decide whether the session cookie is marked Secure. Any client can send
      # that header, so only turn it on when a proxy is stripping incoming ones.
      SOUNDSTORM_TRUST_PROXY: ${SOUNDSTORM_TRUST_PROXY:-false}
      # What the first sign-up must present. The installer writes one and
      # opens the browser with it in the address; left empty, SoundStorm makes
      # one up at start and prints it in its log until an account exists.
      SOUNDSTORM_SETUP_CODE: ${SOUNDSTORM_SETUP_CODE:-}
    volumes:
      - soundstorm-state:/var/lib/soundstorm
      # The whole library, writable: SoundStorm creates the folder structure on
      # first run so nobody has to read a README to learn the layout.
      #
      # Beside this file by default; SOUNDSTORM_LIBRARY_PATH in .env moves it -
      # to an external drive, say - and every backend below follows, because
      # they all mount their shelf from the same variable. Keep the whole
      # library on one drive: uploads are staged in its root and moved into
      # place.
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}:/library
    depends_on:
      - navidrome
      - jellyfin
      - audiobookshelf
      - immich-server
    healthcheck:
      # Either scheme: the same container serves plain HTTP or TLS depending on
      # SOUNDSTORM_TLS, and a healthcheck that only knew one would report the
      # other as unhealthy forever.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || wget -qO- --no-check-certificate https://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  navidrome:
    image: deluan/navidrome:latest
    container_name: soundstorm-navidrome
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # Rescan often enough that dropping a file in feels immediate.
      #
      # ND_SCANINTERVAL, not ND_SCANSCHEDULE: Navidrome renamed this and
      # ignores unknown keys in silence, so the old name looked like it was
      # working while no periodic scan ever ran. New music only appeared when
      # the container restarted. Verified against 0.64.0, whose --help lists
      # --scaninterval and nothing called scanschedule.
      ND_SCANINTERVAL: 1m
      ND_LOGLEVEL: info
      # Nothing here should phone home; SoundStorm is the only client.
      ND_ENABLEEXTERNALSERVICES: "false"
    volumes:
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}/music:/music:ro
      - navidrome-data:/data
    # Deliberately no ports. SoundStorm reaches it at http://navidrome:4533.

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: soundstorm-jellyfin
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}/movies:/media/movies:ro
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}/tv:/media/tv:ro
    # Deliberately no ports. SoundStorm reaches it at http://jellyfin:8096.

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: soundstorm-audiobookshelf
    restart: unless-stopped
    volumes:
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}/audiobooks:/audiobooks
      - abs-config:/config
      - abs-metadata:/metadata
    # Deliberately no ports. SoundStorm reaches it at http://audiobookshelf:80.

  # Pictures. Immich is four containers - the server, the machine learning
  # that makes "dog on a beach" find a photo, a Postgres with vector search,
  # and a Valkey cache - and all four are pinned to a *major* version rather
  # than latest. Immich keeps its promise of breaking changes only in major
  # releases, and v3 broke API endpoints third-party tools use, which is
  # exactly what SoundStorm is. Moving to v4 is a deliberate change here.
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    container_name: soundstorm-immich
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      # Reachable only on this compose network, by Immich itself: the
      # database publishes no port and SoundStorm never talks to it.
      DB_PASSWORD: ${SOUNDSTORM_IMMICH_DB_PASSWORD:-soundstorm-immich}
      REDIS_HOSTNAME: immich-redis
    volumes:
      # Read-only: Immich indexes the folder in place and can never move,
      # rename or delete a photo in it.
      - ${SOUNDSTORM_LIBRARY_PATH:-./library}/pictures:/pictures:ro
      # Immich's own working space - thumbnails, previews, transcoded clips.
      # A named volume, not a folder: it is regenerated from the photos.
      - immich-data:/data
    depends_on:
      - immich-redis
      - immich-database
    # Deliberately no ports. SoundStorm reaches it at http://immich-server:2283.

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3
    container_name: soundstorm-immich-ml
    restart: unless-stopped
    volumes:
      # Models are downloaded on first use - a couple of minutes during which
      # searching by what is in a picture falls back to searching file names.
      - immich-models:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: soundstorm-immich-redis
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: soundstorm-immich-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${SOUNDSTORM_IMMICH_DB_PASSWORD:-soundstorm-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # A named volume, never a folder: Immich's database must not sit on a
      # network share or an NTFS drive, and a named volume lives on Docker's
      # own Linux disk wherever the host is.
      - immich-db:/var/lib/postgresql/data
    shm_size: 128mb

  # Remote access, and only if asked for. Nothing below runs unless you start
  # the stack with --profile tailscale.
  #
  #   docker compose --profile tailscale up -d
  #
  # It puts SoundStorm on your tailnet at https://<hostname>.<tailnet>.ts.net
  # with a real certificate, so it works away from the house with no port
  # forwarded, nothing exposed to the internet, and no browser warning.
  #
  # Two things this cannot do for you: a tailscale.com account, and the
  # Tailscale app on every device that wants to connect. Both need a person.
  # SoundStorm is fully working without any of it - that is why this is a
  # profile and not a service.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:latest
    container_name: soundstorm-tailscale
    restart: unless-stopped
    # The name this machine takes on your tailnet, and therefore the address
    # you will type. Keep it short.
    hostname: ${SOUNDSTORM_TAILSCALE_HOSTNAME:-soundstorm}
    environment:
      # From the Tailscale admin console, Settings -> Keys -> Generate auth
      # key. The installer's --tailscale writes it into .env for you.
      TS_AUTHKEY: ${SOUNDSTORM_TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Tailscale terminates TLS with a genuine Let's Encrypt certificate and
      # proxies to SoundStorm over the internal compose network.
      TS_SERVE_CONFIG: /config/serve.json
      # The default, and stated rather than assumed: userspace networking
      # needs no NET_ADMIN and no /dev/net/tun, so this stays an ordinary
      # unprivileged container. Kernel mode is faster and not worth the
      # capabilities for one proxied web app.
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - soundstorm

volumes:
  soundstorm-state:
  tailscale-state:
  navidrome-data:
  jellyfin-config:
  jellyfin-cache:
  abs-config:
  abs-metadata:
  immich-data:
  immich-models:
  immich-db:
