# SoundStorm: one login and one search box over a self-hosted media library.
#
# This file is the whole installation. It needs no repository, no build step and
# no configuration - download it into an empty folder and run:
#
#   docker compose up -d        then open http://localhost:8099
#
# SoundStorm creates ./library beside this file on first run, with one folder per
# media type. Put a file in the matching folder and it appears. There are no API
# keys to fetch: SoundStorm provisions its own credentials for every backend on
# first boot.
#
#   library/
#     music/   movies/   tv/   audiobooks/   ebooks/
#
# The important line in this file is the one that is missing. None of the three
# backends publishes a port. They are reachable only on the internal compose
# network, by SoundStorm. That is what makes "one login" true rather than
# decorative: their own login screens are not one URL away, because they are not
# reachable at all.
#
# To build from source instead of pulling a published image - which is what you
# want if you are working on SoundStorm itself:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

name: soundstorm

services:
  soundstorm:
    # Pinned by tag rather than digest so an upgrade is `docker compose pull`.
    # Set SOUNDSTORM_IMAGE to hold a specific version.
    image: ${SOUNDSTORM_IMAGE:-ghcr.io/gabrielhollberg/soundstorm:latest}
    container_name: soundstorm
    restart: unless-stopped
    ports:
      # Host port is configurable because 8080 is a popular address - a Calibre
      # content server defaults to it, for one. Override with SOUNDSTORM_PORT,
      # which the installer writes into a .env file beside this one.
      - "${SOUNDSTORM_PORT:-8099}:8080"
    environment:
      # A backend exists if its URL is set, so this file decides the stack.
      SOUNDSTORM_NAVIDROME_URL: http://navidrome:4533
      SOUNDSTORM_JELLYFIN_URL: http://jellyfin:8096
      # The movie folder as *jellyfin's* container sees it, which is what its
      # library API wants - not SoundStorm's view of the same directory.
      SOUNDSTORM_JELLYFIN_MEDIA_PATH: /media/movies
      SOUNDSTORM_JELLYFIN_TV_PATH: /media/tv
      SOUNDSTORM_AUDIOBOOKSHELF_URL: http://audiobookshelf:80
      SOUNDSTORM_AUDIOBOOKSHELF_MEDIA_PATH: /audiobooks
      # SoundStorm creates and owns this folder. Ebooks are read straight out of
      # it, since an EPUB describes itself and needs no backend; the other
      # three folders are handed to the server that indexes them.
      SOUNDSTORM_LIBRARY_DIR: /library
      # How the same folder looks to whoever ran compose, for the UI to show.
      SOUNDSTORM_LIBRARY_HINT: ${SOUNDSTORM_LIBRARY_HINT:-./library}
      SOUNDSTORM_LOG_LEVEL: info

      # TLS. Off by default, deliberately: on localhost there is nothing on the
      # wire to protect, and a certificate warning is a poor first screen.
      # Turn it on the moment this is reachable from another machine.
      #
      #   SOUNDSTORM_TLS=self-signed   SoundStorm runs its own certificate
      #                                authority. Install http://host:8099/ca.crt
      #                                once per device and there is no warning,
      #                                at any address, forever.
      #   SOUNDSTORM_TLS=file          bring your own, with _CERT and _KEY.
      #
      # SOUNDSTORM_TLS_HOSTS is optional - certificates are minted for whatever
      # address a client actually dials, including a bare LAN IP.
      SOUNDSTORM_TLS: ${SOUNDSTORM_TLS:-off}
      SOUNDSTORM_TLS_CERT: ${SOUNDSTORM_TLS_CERT:-}
      SOUNDSTORM_TLS_KEY: ${SOUNDSTORM_TLS_KEY:-}
      SOUNDSTORM_TLS_HOSTS: ${SOUNDSTORM_TLS_HOSTS:-}
      # Behind a reverse proxy that terminates TLS: lets X-Forwarded-Proto
      # decide whether the session cookie is marked Secure. Any client can send
      # that header, so only turn it on when a proxy is stripping incoming ones.
      SOUNDSTORM_TRUST_PROXY: ${SOUNDSTORM_TRUST_PROXY:-false}
    volumes:
      - soundstorm-state:/var/lib/soundstorm
      # The whole library, writable: SoundStorm creates the folder structure on
      # first run so nobody has to read a README to learn the layout.
      - ./library:/library
    depends_on:
      - navidrome
      - jellyfin
      - audiobookshelf
    healthcheck:
      # Either scheme: the same container serves plain HTTP or TLS depending on
      # SOUNDSTORM_TLS, and a healthcheck that only knew one would report the
      # other as unhealthy forever.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || wget -qO- --no-check-certificate https://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  navidrome:
    image: deluan/navidrome:latest
    container_name: soundstorm-navidrome
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # Rescan often enough that dropping a file in feels immediate.
      #
      # ND_SCANINTERVAL, not ND_SCANSCHEDULE: Navidrome renamed this and
      # ignores unknown keys in silence, so the old name looked like it was
      # working while no periodic scan ever ran. New music only appeared when
      # the container restarted. Verified against 0.64.0, whose --help lists
      # --scaninterval and nothing called scanschedule.
      ND_SCANINTERVAL: 1m
      ND_LOGLEVEL: info
      # Nothing here should phone home; SoundStorm is the only client.
      ND_ENABLEEXTERNALSERVICES: "false"
    volumes:
      - ./library/music:/music:ro
      - navidrome-data:/data
    # Deliberately no ports. SoundStorm reaches it at http://navidrome:4533.

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: soundstorm-jellyfin
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./library/movies:/media/movies:ro
      - ./library/tv:/media/tv:ro
    # Deliberately no ports. SoundStorm reaches it at http://jellyfin:8096.

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: soundstorm-audiobookshelf
    restart: unless-stopped
    volumes:
      - ./library/audiobooks:/audiobooks
      - abs-config:/config
      - abs-metadata:/metadata
    # Deliberately no ports. SoundStorm reaches it at http://audiobookshelf:80.

volumes:
  soundstorm-state:
  navidrome-data:
  jellyfin-config:
  jellyfin-cache:
  abs-config:
  abs-metadata:
