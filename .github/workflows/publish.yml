# Build, test, and publish the SoundStorm image.
#
# The compose file an end user downloads names a published image, so without
# this workflow the install instructions refer to something that does not exist.
# That is the whole job here.
#
# Images land at ghcr.io/<owner>/soundstorm. GHCR needs no account setup and no
# secrets: GITHUB_TOKEN can push to it, which is why it is here rather than
# Docker Hub.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # No dependencies means nothing to cache, and a cache miss on an
          # empty module graph is slower than not trying.
          cache: false

      # Formatting is a hard failure rather than a comment on a pull request.
      # gofmt disagreeing with a checkout is a five second fix and an
      # unreadable diff forever.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

      # SoundStorm-Setup.cmd is downloaded straight from raw.githubusercontent
      # and run by cmd.exe, which does not reliably honour `goto` with LF line
      # endings - and this file uses goto. A repo-wide `sed -i` has quietly
      # stripped the carriage returns out of it twice now, which is not
      # something anybody would notice until the first person to try it got a
      # batch file that ran half of itself.
      #
      # Counted rather than pattern-matched. The first version of this check
      # grepped for an escaped r, which reaches grep as an escape sequence a
      # POSIX basic regexp does not define - GNU grep reads it as a plain
      # letter r. So the check passed on any file containing the letter r,
      # which is every file, and it sat here green through the exact sed -i it
      # was written to catch. Counting also catches half a file being
      # converted, which matching never could.
      - name: The Windows setup file still has CRLF
        run: |
          returns=$(tr -cd '\r' < SoundStorm-Setup.cmd | wc -c)
          lines=$(wc -l < SoundStorm-Setup.cmd)
          if [ "$returns" -gt 0 ] && [ "$returns" -eq "$lines" ]; then
            echo "SoundStorm-Setup.cmd has its carriage returns ($returns of $lines lines)."
          else
            echo "SoundStorm-Setup.cmd has lost its CRLF line endings."
            echo "$returns of $lines lines end with a carriage return; all of them should."
            echo "cmd.exe needs them for goto. See .gitattributes."
            exit 1
          fi

  publish:
    # Never publish something that does not pass. A broken :latest is worse
    # than no :latest, because it reaches people who did nothing wrong.
    needs: test
    # A pull request from a fork cannot have package write permission, and
    # should not publish anyway - it is checked, not released.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU for the arm64 image. The Dockerfile cross-compiles rather than
      # emulating the Go build, so this only has to run the handful of apk
      # commands in the run stage.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A GitHub username may have capitals in it; a registry path may not.
      # github.repository_owner is the name as typed, so it has to be folded
      # here - "GabrielHollberg" is a perfectly ordinary account name and an
      # invalid image reference.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/soundstorm
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters more than usual here: a lot of the machines people
          # run a home media server on are a Raspberry Pi, a Synology, or an
          # Apple silicon Mac.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Windows setup file has to be a release asset rather than a link into
  # the repository: raw.githubusercontent serves text/plain with no
  # Content-Disposition, so clicking a link to a .cmd opens it in the browser
  # instead of saving it. A release asset is served as an attachment, which is
  # an actual download.
  #
  # The README points at /releases/latest/download/, so a release without this
  # file attached does not merely lack an asset - it breaks the download link
  # on the front page. Hence doing it here rather than remembering to.
  release:
    needs: [test, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Attach the Windows setup file to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag can arrive with a release already made by hand, or on its
          # own from `git push --tags`. Both have to end up with the asset.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "No release for $GITHUB_REF_NAME yet - creating one."
            gh release create "$GITHUB_REF_NAME" \
              --title "SoundStorm $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" SoundStorm-Setup.cmd --clobber
          echo "Attached SoundStorm-Setup.cmd to $GITHUB_REF_NAME"
